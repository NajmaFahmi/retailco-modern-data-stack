version: 2


models:
  - name: fact_sales
    description: "Sales fact table at transaction grain with foreign keys to dimensions."
    columns:
      - name: order_id
        description: "Unique identifier for each sales transaction."
        tests:
          - unique
          - not_null
      - name: city_id
        description: "Foreign key to dim_city."
        tests:
          - not_null
      - name: product_id
        description: "Foreign key to dim_product."
        tests:
          - not_null


  - name: dim_city
    description: "City dimension with surrogate key."
    columns:
      - name: city_id
        tests:
          - unique
          - not_null


  - name: dim_product
    description: "Product dimension with surrogate key and average price."
    columns:
      - name: product_id
        tests:
          - unique
          - not_null